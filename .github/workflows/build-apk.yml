name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "Error: Could not detect Java version string."
            exit 1
          fi
          echo "Detected Java version string: $JAVA_VER_STRING"

          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F. '{if ($1 == 1) print $2; else print $1}')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse Java major version from '$JAVA_VER_STRING'."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Android SDK and environment
        run: |
          echo "=== Android SDK & Environment Setup ==="
          if [ -f "./.env.example" ] && [ ! -f "./.env" ]; then
            echo "Creating .env from .env.example..."
            cp ./.env.example ./.env
          fi

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          # Fix runner permissions on Android SDK directory
          if [ -d "$ANDROID_HOME" ]; then
            sudo chown -R "$USER":"$USER" "$ANDROID_HOME" 2>/dev/null || true
            sudo chmod -R u+w "$ANDROID_HOME" 2>/dev/null || true
          fi

          # Accept and pre-populate all standard SDK licenses
          mkdir -p "$ANDROID_HOME/licenses"
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-license"
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
89337a07077026e6e22a30564f2257c7ff11432a
601085b94cd77f0b54ff86406957099fed80721d
EOF
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
84831b9409646a247e3073db4080447aa45d715a
799f227c33e73674f883219714c4173c45abb678
EOF
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
859f317696f67ef3d7f30a50a5560e7834b43903
EOF

          # Locate sdkmanager
          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_BIN=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -perm /111 2>/dev/null | head -n 1)
            if [ -n "$FOUND_BIN" ]; then
              SDKMANAGER_BIN="$FOUND_BIN"
            fi
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager at: $SDKMANAGER_BIN"
            yes | "$SDKMANAGER_BIN" --licenses 2>/dev/null || true
            "$SDKMANAGER_BIN" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" 2>/dev/null || true
          else
            echo "Warning: sdkmanager not found, relying on pre-installed SDK and automatic downloads."
          fi

          # Ensure platforms directory has both android-36 and android-36.1 for AGP 9.1.1
          mkdir -p "$ANDROID_HOME/platforms"
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            echo "Linking android-36 to android-36.1 for compileSdk 36.1..."
            cp -r "$ANDROID_HOME/platforms/android-36" "$ANDROID_HOME/platforms/android-36.1"
            if [ -f "$ANDROID_HOME/platforms/android-36.1/source.properties" ]; then
              sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=36.1/' "$ANDROID_HOME/platforms/android-36.1/source.properties" || true
            fi
          elif [ -d "$ANDROID_HOME/platforms/android-36.1" ] && [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "Linking android-36.1 to android-36..."
            cp -r "$ANDROID_HOME/platforms/android-36.1" "$ANDROID_HOME/platforms/android-36"
          fi

          echo "Available platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating temporary debug.keystore using Java 17 keytool..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create or find ./debug.keystore."
            exit 1
          fi

          echo "Temporary debug.keystore is present and verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== APK Verification ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK not found at $TARGET_APK."
            echo "Listing files inside app/build/outputs/apk (if present):"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file $TARGET_APK exists but is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: File $TARGET_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK exists and is non-empty: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TMP_RELEASE_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F '/' '{print $NF}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to prepare APK release asset at $DEST_PATH."
            exit 1
          fi

          echo "Release asset prepared: $DEST_PATH"
          ls -lh "$DEST_PATH"

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is invalid or missing."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset is not an .apk file."
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Publishing release '$RELEASE_TITLE' with tag '$TAG_NAME'..."

          NOTES_CONTENT=$(cat <<EOF
### Android Debug APK Build

- **Build Source:** Built automatically by GitHub Actions.
- **Workflow Run Number:** #${{ github.run_number }}
- **Workflow Run Attempt:** ${{ github.run_attempt }}
- **Commit SHA:** \`${{ github.sha }}\`
- **APK Asset Filename:** \`${ASSET_NAME}\`
- **Notice:** This APK is an automatically generated debug build intended for testing. It is signed with a temporary debug keystore and is not an official Google Play Store production release.
EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES_CONTENT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Final APK Download & Release Report ==="
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release published successfully."
            gh release view "$TAG_NAME" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Success" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release URL:** [View GitHub Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Downloadable APK:** \`${ASSET_NAME}\` is available directly under the release **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard Actions artifact \`app-debug-apk\` is also preserved and available in the summary section below." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing did not complete successfully."
            echo "The debug APK build and GitHub Actions artifact upload completed without errors."
            echo "Artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Notice: Actions Artifact Ready (Release Publishing Incomplete)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was **built successfully** and preserved as a GitHub Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Name:** \`app-debug-apk\` (available in the Artifacts section below)." >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub Release publishing did not complete on this run (e.g., repository permissions or rate limits)." >> "$GITHUB_STEP_SUMMARY"
            echo "- The completed APK build is safe and downloadable via the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
