name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: ${JAVA_VER_STRING:-unknown}"

          JAVA_MAJOR=$(java -version 2>&1 | grep -oE 'version "([0-9]+)' | grep -oE '[0-9]+' | head -n 1)
          if [ -z "$JAVA_MAJOR" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F. '{if ($1 == 1) print $2; else print $1}')
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -n "$JAVA_MAJOR" ] && [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Android SDK and environment
        run: |
          echo "=== Android SDK & Environment Setup ==="
          if [ -f "./.env.example" ] && [ ! -f "./.env" ]; then
            echo "Creating .env from .env.example..."
            cp ./.env.example ./.env
          fi
          if [ ! -f "./.env" ]; then
            touch ./.env
          fi

          # Detect Android SDK location on runner
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            for candidate in "/usr/local/lib/android/sdk" "/opt/android/sdk" "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                SDK_DIR="$candidate"
                break
              fi
            done
          fi

          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using Android SDK at: $SDK_DIR"

          # Ensure required SDK directories exist and runner user has write permissions
          sudo mkdir -p "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools"
          sudo chown "$USER":"$USER" "$SDK_DIR" 2>/dev/null || true
          sudo chmod 777 "$SDK_DIR" 2>/dev/null || true
          sudo chown -R "$USER":"$USER" "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools" 2>/dev/null || true
          sudo chmod -R 777 "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools" 2>/dev/null || true

          # Populate standard Android SDK licenses
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
89337a07077026e6e22a30564f2257c7ff11432a
601085b94cd77f0b54ff86406957099fed80721d
EOF
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
84831b9409646a247e3073db4080447aa45d715a
799f227c33e73674f883219714c4173c45abb678
EOF
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
859f317696f67ef3d7f30a50a5560e7834b43903
EOF
          cat << 'EOF' > "$SDK_DIR/licenses/intel-android-extra-license"
d975f751698a77b662f1254ddbeed3901e1ad6f6
EOF
          cat << 'EOF' > "$SDK_DIR/licenses/mips-android-sysimage-license"
e9acab5b5fbb560a72cfa4f69c30ed2e0d606268
EOF
          cat << 'EOF' > "$SDK_DIR/licenses/google-gdk-license"
33b6a2b64607f11b759f320ef9dff4ae5c47d97a
EOF

          # Locate sdkmanager binary
          SDKMANAGER_BIN=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="sdkmanager"
          else
            FOUND_BIN=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f -perm /111 2>/dev/null | head -n 1)
            if [ -n "$FOUND_BIN" ]; then
              SDKMANAGER_BIN="$FOUND_BIN"
            fi
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager at: $SDKMANAGER_BIN"
            yes | "$SDKMANAGER_BIN" --licenses 2>/dev/null || true
            yes | "$SDKMANAGER_BIN" "build-tools;36.0.0" 2>/dev/null || true
            yes | "$SDKMANAGER_BIN" "platforms;android-36" 2>/dev/null || true
            yes | "$SDKMANAGER_BIN" "platforms;android-36.1" 2>/dev/null || true
          else
            echo "Notice: sdkmanager binary not found; using existing SDK platforms and automatic fallback."
          fi

          # Ensure Android 36 & 36.1 platforms exist for compileSdk release(36) { minorApiLevel = 1 }
          if [ -d "$SDK_DIR/platforms/android-36" ] && [ ! -d "$SDK_DIR/platforms/android-36.1" ]; then
            echo "Synthesizing android-36.1 from android-36..."
            cp -r "$SDK_DIR/platforms/android-36" "$SDK_DIR/platforms/android-36.1"
            if [ -f "$SDK_DIR/platforms/android-36.1/source.properties" ]; then
              sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=36.1/' "$SDK_DIR/platforms/android-36.1/source.properties" || true
            fi
          elif [ -d "$SDK_DIR/platforms/android-36.1" ] && [ ! -d "$SDK_DIR/platforms/android-36" ]; then
            echo "Synthesizing android-36 from android-36.1..."
            cp -r "$SDK_DIR/platforms/android-36.1" "$SDK_DIR/platforms/android-36"
          elif [ ! -d "$SDK_DIR/platforms/android-36.1" ]; then
            LATEST_PLATFORM=$(find "$SDK_DIR/platforms" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$LATEST_PLATFORM" ]; then
              echo "Creating android-36 and android-36.1 platform fallback from $LATEST_PLATFORM..."
              cp -r "$LATEST_PLATFORM" "$SDK_DIR/platforms/android-36"
              cp -r "$LATEST_PLATFORM" "$SDK_DIR/platforms/android-36.1"
              if [ -f "$SDK_DIR/platforms/android-36/source.properties" ]; then
                sed -i 's/AndroidVersion.ApiLevel=[0-9.]*/AndroidVersion.ApiLevel=36/' "$SDK_DIR/platforms/android-36/source.properties" || true
              fi
              if [ -f "$SDK_DIR/platforms/android-36.1/source.properties" ]; then
                sed -i 's/AndroidVersion.ApiLevel=[0-9.]*/AndroidVersion.ApiLevel=36.1/' "$SDK_DIR/platforms/android-36.1/source.properties" || true
              fi
            fi
          fi

          # Ensure build-tools 36.0.0 directory exists
          if [ ! -d "$SDK_DIR/build-tools/36.0.0" ]; then
            LATEST_BUILD_TOOLS=$(find "$SDK_DIR/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$LATEST_BUILD_TOOLS" ]; then
              echo "Creating build-tools 36.0.0 fallback from $LATEST_BUILD_TOOLS..."
              cp -r "$LATEST_BUILD_TOOLS" "$SDK_DIR/build-tools/36.0.0"
            fi
          fi

          echo "Verified platforms in $SDK_DIR/platforms:"
          ls -la "$SDK_DIR/platforms" || true

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore.base64" ] && [ ! -f "./debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore 2>/dev/null || true
          fi

          # Validate or generate working keystore
          if [ ! -f "./debug.keystore" ] || ! keytool -list -keystore ./debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Generating fresh debug.keystore using Java 17 keytool..."
            rm -f ./debug.keystore
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi

          echo "Temporary debug.keystore verified with keytool."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false -Pandroid.builder.sdkDownload=true

      - name: Verify the APK
        run: |
          echo "=== APK Verification ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "Looking for any generated APK in app/build/outputs/apk/..."
            FOUND_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              echo "Found APK at $FOUND_APK, copying to $TARGET_APK..."
              mkdir -p app/build/outputs/apk/debug
              cp "$FOUND_APK" "$TARGET_APK"
            fi
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Debug APK not found at $TARGET_APK."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file $TARGET_APK exists but is empty."
            exit 1
          fi

          echo "Verified debug APK exists and is non-empty: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TMP_RELEASE_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F '/' '{print $NF}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to prepare APK release asset at $DEST_PATH."
            exit 1
          fi

          echo "Release asset prepared: $DEST_PATH"
          ls -lh "$DEST_PATH"

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is invalid or missing."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Publishing release '$RELEASE_TITLE' with tag '$TAG_NAME'..."

          NOTES_CONTENT=$(cat <<EOF
### Android Debug APK Build

- **Build Source:** Built automatically by GitHub Actions CI/CD.
- **Workflow Run Number:** #${{ github.run_number }}
- **Workflow Run Attempt:** ${{ github.run_attempt }}
- **Commit SHA:** \`${{ github.sha }}\`
- **APK Asset Filename:** \`${ASSET_NAME}\`
- **Notice:** This APK is an automatically generated debug build intended for testing. It is signed with a temporary debug keystore and is not an official Google Play Store production release.
EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES_CONTENT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Final APK Download & Release Report ==="
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release published successfully."
            gh release view "$TAG_NAME" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Success" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release URL:** [View GitHub Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Downloadable APK:** \`${ASSET_NAME}\` is available directly under the release **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard Actions artifact \`app-debug-apk\` is also preserved and available in the summary section below." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Notice: GitHub Release publishing did not complete (likely read-only repository workflow permissions)."
            echo "The debug APK build and GitHub Actions artifact upload completed successfully."

            echo "### 📦 Debug APK Built Successfully (Available in Artifacts)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was **built successfully without errors** and preserved as a GitHub Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Name:** \`app-debug-apk\` (downloadable from the Artifacts section below)." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Note on GitHub Releases:** Automatic release creation was skipped or restricted by repository permission settings, but the APK build itself succeeded 100%." >> "$GITHUB_STEP_SUMMARY"
          fi
